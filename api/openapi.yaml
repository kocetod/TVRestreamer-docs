openapi: 3.1.0
info:
  title: TvRestream Admin API
  version: 0.1.0
  description: |
    REST API of tvr-core. The Admin UI uses the same API.
    Draft contract — v0.1 (concept). See docs/bg/05-api.md / docs/en/05-api.md.
servers:
  - url: https://admin.example.com/api/v1
security:
  - bearerAuth: []
  - apiKey: []
tags:
  - name: auth
  - name: streams
  - name: categories
  - name: packages
  - name: subscribers
  - name: sessions
  - name: nodes
  - name: monitoring
  - name: settings
paths:
  /auth/login:
    post:
      tags: [auth]
      security: []
      description: |
        Вход на администратор (TVR-006). Access токенът (JWT, 15 мин) е в тялото; refresh токенът
        (7 дни) е само в httpOnly бисквитка `tvr_refresh` (SameSite=Strict, Path=/api/v1/auth).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string}
                totp: {type: string, pattern: '^[0-9]{6}$', description: 'от TVR-073 (2FA)'}
      responses:
        '200':
          description: Tokens
          headers:
            Set-Cookie: {schema: {type: string}, description: 'tvr_refresh=…; HttpOnly; SameSite=Strict; Path=/api/v1/auth'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenPair'}
        '401': {$ref: '#/components/responses/Problem'}
  /auth/refresh:
    post:
      tags: [auth]
      security: []
      description: Ротира refresh токена от бисквитката `tvr_refresh`. Повторна употреба на стар токен отнема всички сесии.
      responses:
        '200':
          description: Tokens (+ нова бисквитка)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenPair'}
        '401': {$ref: '#/components/responses/Problem'}
  /auth/logout:
    post:
      tags: [auth]
      security: []
      description: Отнема refresh токена от бисквитката и я изчиства.
      responses:
        '204': {description: Logged out}
  /auth/me:
    get:
      tags: [auth]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserInfo'}
        '401': {$ref: '#/components/responses/Problem'}

  /streams:
    get:
      tags: [streams]
      description: |
        List of channels (any admin role). Sortable by name, slug, lcn, enabled, createdAt, updatedAt
        (default name,asc). `status` filters by the runtime state reported by the agent (TVR-020); an
        unknown value is 400.
      parameters:
        - {name: status, in: query, schema: {$ref: '#/components/schemas/StreamState'}}
        - {name: categoryId, in: query, schema: {type: string, format: uuid}}
        - {name: nodeId, in: query, schema: {type: string, format: uuid}}
        - {name: enabled, in: query, schema: {type: boolean}}
        - {name: mode, in: query, schema: {type: string, enum: [ALWAYS_ON, ON_DEMAND]}}
        - {name: packageId, in: query, description: 'Not supported until packages (S3) — returns 400', schema: {type: string, format: uuid}}
        - {name: q, in: query, description: 'Part of the name or slug (case-insensitive), or an exact LCN', schema: {type: string}}
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/sort'
      responses:
        '200':
          description: Page of streams
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/Stream'}
        '400': {$ref: '#/components/responses/Problem'}
    post:
      tags: [streams]
      description: Create a channel with its inputs and outputs (ADMIN, OPERATOR). 409 when the slug is taken.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StreamInput'}
      responses:
        '201':
          description: Created (Location header = /api/v1/streams/{id})
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Stream'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /streams/{id}:
    parameters: [{$ref: '#/components/parameters/id'}]
    get:
      tags: [streams]
      responses:
        '200':
          description: Stream
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Stream'}
        '404': {$ref: '#/components/responses/Problem'}
    put:
      tags: [streams]
      description: |
        Full update. Inputs/outputs with an id are updated, without an id created, missing ones removed.
        version must be the current one (else 409); it grows by 1 with every effective change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/StreamInput'
                - type: object
                  required: [version]
                  properties:
                    version: {type: integer}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Stream'}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
    delete:
      tags: [streams]
      description: Soft delete (BR-02) — the channel disappears from the API and its slug becomes free.
      responses:
        '204': {description: Soft-deleted}
        '404': {$ref: '#/components/responses/Problem'}
  /streams/{id}/actions/{action}:
    parameters:
      - $ref: '#/components/parameters/id'
      - name: action
        in: path
        required: true
        schema: {type: string, enum: [start, stop, restart]}
    post:
      tags: [streams]
      description: |
        FR-STR-05 (TVR-021). `start` / `stop` set `enabled` (the channel stays started or stopped after restarts
        of core and agent; the version grows unless it already was in that state). `restart` sends a restart
        command to the agent that runs the channel; nothing changes in the database. ADMIN or OPERATOR.
      responses:
        '202':
          description: Accepted; the channel as it is now (the agent applies the action within 1–3 s)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Stream'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: restart of a stopped channel, of a channel without a node, or whose node is not connected
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /streams/{id}/logs:
    parameters: [{$ref: '#/components/parameters/id'}]
    get:
      tags: [streams]
      summary: Last lines of the channel log (FR-LOG-01, TVR-023)
      description: |
        core asks the agent of the channel's node (gRPC `FetchLogs`) and waits up to 5 s
        (`tvr.grpc.logs-timeout`). The agent keeps the last 1 000 lines per channel (FFmpeg output and its own
        events: start, exit, restart), also after the channel stops, until the agent restarts. URLs in the lines
        are redacted (password, token). ADMIN or OPERATOR.
      parameters:
        - {name: tail, in: query, schema: {type: integer, default: 500, minimum: 1, maximum: 1000}}
      responses:
        '200':
          description: The lines, oldest first
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StreamLog'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: the channel has no node, or its node is not connected
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '504':
          description: the agent did not answer within 5 s
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /streams/{id}/actions/switch-input:
    parameters: [{$ref: '#/components/parameters/id'}]
    post:
      tags: [streams]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [inputId]
              properties:
                inputId: {type: string, format: uuid}
                pin: {type: boolean, default: false}
      responses:
        '202': {description: Accepted}
  /streams/{id}/analyzer:
    parameters: [{$ref: '#/components/parameters/id'}]
    get:
      tags: [streams]
      responses:
        '200':
          description: Live analyzer snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnalyzerSnapshot'}
  /streams/{id}/events:
    parameters: [{$ref: '#/components/parameters/id'}]
    get:
      tags: [streams]
      summary: History of the channel's events, newest first (FR-FOV-07, TVR-029)
      description: |
        FAILOVER (data.from / data.to = input ids, from_index / to_index, reason), STATUS (every change of the
        state, data.from / data.to), and the other events the agent reports (PROCESS_EXITED, INPUT_LOST…).
        Kept for 180 days (monthly partitions). Any admin role.
      parameters:
        - {name: type, in: query, description: 'Event types, repeated or comma-separated (e.g. FAILOVER,STATUS)', schema: {type: array, items: {type: string}}, style: form, explode: true}
        - {name: from, in: query, description: 'Only events at or after this instant', schema: {type: string, format: date-time}}
        - {name: to, in: query, description: 'Only events before this instant', schema: {type: string, format: date-time}}
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: Page of events
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/StreamEvent'}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /inputs/probe:
    post:
      tags: [streams]
      summary: Test an input with ffprobe before saving it (FR-INP-07, TVR-022)
      description: |
        Runs ffprobe on the tvr-core host with a hard limit of 9 s (the response arrives within 10 s).
        ADMIN and OPERATOR only. Accepts an InputDef; only type, url, timeoutSec and
        options.userAgent / options.rtspTransport are used. DVB inputs cannot be probed.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProbeRequest'}
      responses:
        '200':
          description: Probe result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProbeResult'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422':
          description: The input could not be read; `code` says why
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProbeProblem'}
        '429': {$ref: '#/components/responses/Problem'}
        '503':
          description: ffprobe is not installed on the server (`code` FFPROBE_MISSING)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProbeProblem'}

  /categories:
    get:
      tags: [categories]
      description: All categories in display order (sortOrder, then name). Any admin role.
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Category'}
    post:
      tags: [categories]
      description: |
        Create a category (ADMIN, OPERATOR). Without sortOrder it goes last.
        409 when the name is taken (ignoring case).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CategoryInput'}
      responses:
        '201':
          description: Created (Location header = /api/v1/categories/{id})
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Category'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /categories/order:
    put:
      tags: [categories]
      description: |
        New order of all categories (drag and drop): ids of every category exactly once; position i gets
        sortOrder = i. A missing, unknown or repeated id → 400 (errors[].field = "[i]" or "").
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: {type: string, format: uuid}
      responses:
        '200':
          description: Categories in the new order
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Category'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /categories/{id}:
    parameters: [{$ref: '#/components/parameters/id'}]
    get:
      tags: [categories]
      responses:
        '200':
          description: Category
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Category'}
        '404': {$ref: '#/components/responses/Problem'}
    put:
      tags: [categories]
      description: Update the name and optionally sortOrder (kept when omitted). 409 when the name is taken.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CategoryInput'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Category'}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
    delete:
      tags: [categories]
      description: Delete the category; its channels stay, without a category.
      responses:
        '204': {description: Deleted}
        '404': {$ref: '#/components/responses/Problem'}

  /packages:
    get:
      tags: [packages]
      responses:
        '200':
          description: Packages
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Package'}
    post:
      tags: [packages]
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Package'}
      responses:
        '201': {description: Created}
  /packages/{id}/streams:
    parameters: [{$ref: '#/components/parameters/id'}]
    put:
      tags: [packages]
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  streamId: {type: string, format: uuid}
                  sortOrder: {type: integer}
      responses:
        '204': {description: Saved}

  /subscribers:
    get:
      tags: [subscribers]
      parameters:
        - {name: status, in: query, schema: {$ref: '#/components/schemas/SubscriberStatus'}}
        - {name: packageId, in: query, schema: {type: string, format: uuid}}
        - {name: expiresBefore, in: query, schema: {type: string, format: date}}
        - {name: q, in: query, schema: {type: string}}
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: Page of subscribers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/Subscriber'}
    post:
      tags: [subscribers]
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Subscriber'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Subscriber'}
  /subscribers/{id}:
    parameters: [{$ref: '#/components/parameters/id'}]
    get:
      tags: [subscribers]
      responses:
        '200':
          description: Subscriber
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Subscriber'}
    put:
      tags: [subscribers]
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Subscriber'}
      responses:
        '200': {description: Updated}
    delete:
      tags: [subscribers]
      responses:
        '204': {description: Deleted}
  /subscribers/{id}/actions/extend:
    parameters: [{$ref: '#/components/parameters/id'}]
    post:
      tags: [subscribers]
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  properties: {days: {type: integer, minimum: 1}}
                - type: object
                  properties: {until: {type: string, format: date}}
      responses:
        '200': {description: Extended}
  /subscribers/{id}/actions/regenerate-token:
    parameters: [{$ref: '#/components/parameters/id'}]
    post:
      tags: [subscribers]
      responses:
        '200':
          description: New token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: {type: string}
                  playlistUrl: {type: string, format: uri}

  /sessions:
    get:
      tags: [sessions]
      parameters:
        - {name: streamId, in: query, schema: {type: string, format: uuid}}
        - {name: subscriberId, in: query, schema: {type: string, format: uuid}}
        - {name: nodeId, in: query, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Active sessions
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Session'}
  /sessions/{sessionKey}:
    delete:
      tags: [sessions]
      parameters:
        - {name: sessionKey, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: Kicked}

  /nodes:
    get:
      tags: [nodes]
      description: |
        Servers by name (any admin role). status becomes ONLINE on the agent's Hello and OFFLINE 15 s after
        the last heartbeat (FR-NOD-02); connected = the agent has an open gRPC stream right now (TVR-017).
      responses:
        '200':
          description: Nodes
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Node'}
  /nodes/enrollment-tokens:
    post:
      tags: [nodes]
      responses:
        '201':
          description: One-time enrollment token (valid 1h)
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: {type: string}
                  installCommand: {type: string}
                  expiresAt: {type: string, format: date-time}

  /dashboard/summary:
    get:
      tags: [monitoring]
      responses:
        '200':
          description: Dashboard counters
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DashboardSummary'}
  /events:
    get:
      tags: [monitoring]
      summary: Real-time events (Server-Sent Events, TVR-030)
      description: |
        Stream of `event:` / `data:` pairs. First `ready` ({at, until, types}), then
        `stream.status` (LiveStreamStatus), `stream.failover` and `stream.event` (LiveStreamEvent),
        `node.status` (LiveNodeStatus), `node.metrics` (LiveNodeMetrics); `: ping` every 15 s when idle.
        Ends with `bye` ({reason: token-expired | max-duration | slow-client | shutdown}) — reconnect with a
        fresh token and reload through REST (no replay). Any admin role. The token may also be given as
        `?access_token=` (EventSource cannot send headers); only on this path. Later: `session.count`, `alert`.
      security:
        - bearerAuth: []
        - accessTokenQuery: []
      parameters:
        - name: types
          in: query
          description: Comma separated event types or groups (`stream.*`, `node.*`); default all
          schema: {type: string, example: "stream.status,node.*"}
      responses:
        '200':
          description: SSE
          content:
            text/event-stream:
              schema: {type: string}
              example: |
                event:ready
                data:{"at":"2026-10-28T18:01:09Z","until":"2026-10-28T18:16:09Z","types":["stream.status"]}
                retry:3000

                event:stream.status
                data:{"streamId":"6e427630-522c-4d8b-9161-d873f424f7f0","state":"STOPPED","previousState":"ONLINE","changed":true,"activeInputId":null,"bitrateIn":0,"since":"2026-10-28T18:01:23Z","lastError":"stopped via the API","nodeId":"11246e35-e0bd-48f5-ad98-18b91503f60b","at":"2026-10-28T18:01:23Z"}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {description: Missing or invalid token}
        '503': {description: Too many open streams on this core instance (tvr.live.max-clients) or core is stopping}

  /settings:
    get:
      tags: [settings]
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
    put:
      tags: [settings]
      requestBody:
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        '200': {description: Saved}
  /import/m3u:
    post:
      tags: [settings]
      parameters:
        - {name: commit, in: query, schema: {type: boolean, default: false}}
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: {type: string, format: binary}
                url: {type: string, format: uri}
      responses:
        '200': {description: Preview or import result}

components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
    apiKey: {type: apiKey, in: header, name: X-API-Key}
    accessTokenQuery: {type: apiKey, in: query, name: access_token, description: "Access token in the URL — GET /events only (TVR-030)"}
  parameters:
    id: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    page: {name: page, in: query, schema: {type: integer, default: 0, minimum: 0}}
    size: {name: size, in: query, schema: {type: integer, default: 50, maximum: 500}}
    sort: {name: sort, in: query, schema: {type: string, example: 'name,asc'}}
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Problem:
      type: object
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        errors:
          type: array
          items:
            type: object
            properties:
              field: {type: string, example: 'inputs[0].url'}
              message: {type: string, example: 'Неподдържан протокол'}
    TokenPair:
      type: object
      properties:
        accessToken: {type: string}
        tokenType: {type: string, example: Bearer}
        expiresIn: {type: integer, description: секунди, example: 900}
        user: {$ref: '#/components/schemas/UserInfo'}
    UserInfo:
      type: object
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        role: {type: string, enum: [ADMIN, OPERATOR, SUPPORT, VIEWER]}
    PageMeta:
      type: object
      properties:
        page: {type: integer}
        size: {type: integer}
        total: {type: integer}
    LiveStreamStatus:
      type: object
      description: "data of `stream.status` (TVR-030)"
      properties:
        streamId: {type: string, format: uuid}
        state: {$ref: '#/components/schemas/StreamState'}
        previousState: {$ref: '#/components/schemas/StreamState'}
        changed: {type: boolean, description: new state or new active input with this report}
        activeInputId: {type: string, format: uuid, nullable: true}
        bitrateIn: {type: integer, format: int64}
        since: {type: string, format: date-time}
        lastError: {type: string, nullable: true}
        nodeId: {type: string, format: uuid}
        at: {type: string, format: date-time}
    LiveStreamEvent:
      type: object
      description: "data of `stream.failover` (type FAILOVER) and `stream.event` (TVR-030)"
      properties:
        streamId: {type: string, format: uuid}
        type: {type: string, example: FAILOVER}
        nodeId: {type: string, format: uuid}
        inputId: {type: string, format: uuid, nullable: true}
        message: {type: string, nullable: true}
        data: {type: object, additionalProperties: true}
        at: {type: string, format: date-time}
    LiveNodeStatus:
      type: object
      description: "data of `node.status` (TVR-030)"
      properties:
        nodeId: {type: string, format: uuid}
        name: {type: string}
        status: {type: string, enum: [ONLINE, OFFLINE, DRAIN]}
        lastSeenAt: {type: string, format: date-time, nullable: true}
        at: {type: string, format: date-time}
    LiveNodeMetrics:
      type: object
      description: "data of `node.metrics` (TVR-030; the agent sends them from TVR-035)"
      properties:
        nodeId: {type: string, format: uuid}
        at: {type: string, format: date-time}
        cpuPercent: {type: number}
        memUsedBytes: {type: integer, format: int64}
        memTotalBytes: {type: integer, format: int64}
        netRxBps: {type: integer, format: int64}
        netTxBps: {type: integer, format: int64}
        tmpfsFreeBytes: {type: integer, format: int64}
        streamsRunning: {type: integer}
        loadAvg1m: {type: number}
    StreamEvent:
      type: object
      properties:
        id: {type: integer, format: int64}
        streamId: {type: string, format: uuid}
        ts: {type: string, format: date-time}
        type: {type: string, description: 'STATUS, FAILOVER, PROCESS_EXITED, INPUT_LOST, INPUT_RESTORED, STARTED, STOPPED, ERROR…', example: FAILOVER}
        nodeId: {type: string, format: uuid, nullable: true}
        inputId: {type: string, format: uuid, nullable: true, description: 'The input it is about (FAILOVER: the new one)'}
        message: {type: string, nullable: true, example: 'input #1 → #2: no data for 5s'}
        data:
          type: object
          additionalProperties: {type: string}
          example: {from: 2c505762-9c66-4877-ba44-c7af718bdc5d, to: 2aa8b6af-8b81-424e-9c61-8334cbc3cc92, from_index: '1', to_index: '2', reason: no data for 5s}
    StreamState:
      type: string
      description: 'DEGRADED = the channel plays from a backup input (not the first one by priority) after a failover'
      enum: [STOPPED, STARTING, ONLINE, DEGRADED, OFFLINE, ERROR]
    InputType:
      type: string
      enum: [HTTP_TS, HLS, UDP, SRT, RTMP, RTSP, DVB]
    OutputType:
      type: string
      enum: [HLS, HTTP_TS, UDP, SRT, RTMP]
    InputDef:
      type: object
      required: [type, url]
      properties:
        id: {type: string, format: uuid, readOnly: true}
        priority: {type: integer, minimum: 1, maximum: 8, description: 'Failover order; default = position in the array'}
        type: {$ref: '#/components/schemas/InputType'}
        url: {type: string, maxLength: 2000, example: 'http://provider/btv.ts', description: 'SEC-07: http, https, udp, rtp, srt, rtmp, rtmps, rtsp, dvb only'}
        timeoutSec: {type: integer, default: 5, minimum: 1, maximum: 120}
        hotStandby: {type: boolean, default: false}
        enabled: {type: boolean, default: true}
        options: {type: object, additionalProperties: true}
    OutputDef:
      type: object
      required: [type]
      properties:
        id: {type: string, format: uuid, readOnly: true}
        type: {$ref: '#/components/schemas/OutputType'}
        public: {type: boolean, default: true}
        enabled: {type: boolean, default: true}
        options: {type: object, additionalProperties: true}
    StreamInput:
      type: object
      required: [name, slug, inputs, outputs]
      properties:
        name: {type: string, maxLength: 120}
        slug: {type: string, pattern: '^[a-z0-9-]{2,64}$'}
        lcn: {type: integer, minimum: 1, maximum: 9999}
        categoryId: {type: string, format: uuid}
        nodeId: {type: string, format: uuid}
        logoUrl: {type: string, maxLength: 500, description: http(s) URL}
        epgId: {type: string, maxLength: 100}
        language: {type: string, maxLength: 10, example: bg}
        description: {type: string}
        tags: {type: array, maxItems: 20, items: {type: string, maxLength: 50}}
        enabled: {type: boolean, default: true}
        mode: {type: string, enum: [ALWAYS_ON, ON_DEMAND], default: ALWAYS_ON}
        processing:
          type: object
          properties:
            pnr: {type: integer}
            keepAudioLangs: {type: array, items: {type: string}}
            dropSubtitles: {type: boolean}
            serviceName: {type: string}
        inputs:
          type: array
          minItems: 1
          maxItems: 8
          items: {$ref: '#/components/schemas/InputDef'}
        outputs:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/OutputDef'}
        packageIds:
          type: array
          description: Accepted but ignored until packages (S3)
          items: {type: string, format: uuid}
    Stream:
      allOf:
        - $ref: '#/components/schemas/StreamInput'
        - type: object
          properties:
            id: {type: string, format: uuid}
            version: {type: integer, description: 0 after create}
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
            status:
              type: object
              description: >-
                Runtime state reported by the agent (TVR-020). STOPPED when the channel is disabled or no report
                came in the last 30 s; then the other fields are null.
              properties:
                state: {$ref: '#/components/schemas/StreamState'}
                activeInputId: {type: string, format: uuid, nullable: true}
                bitrateIn: {type: integer, format: int64, nullable: true, description: 'bits/s of the input (0 while STARTING)'}
                since: {type: string, format: date-time, nullable: true, description: when the channel entered this state}
                lastError: {type: string, nullable: true, description: 'why the channel is OFFLINE, ERROR or DEGRADED'}
                viewers: {type: integer, description: Not reported yet (sessions, S5)}
            urls:
              type: object
              properties:
                hls: {type: string, format: uri}
                ts: {type: string, format: uri}
    StreamLog:
      type: object
      properties:
        streamId: {type: string, format: uuid}
        nodeId: {type: string, format: uuid, description: the node that sent the log}
        tail: {type: integer}
        found: {type: boolean, description: 'false: the agent has no log for the channel (it has not run there since the agent started)'}
        lines:
          type: array
          items:
            type: object
            properties:
              at: {type: string, format: date-time}
              level: {type: string, enum: [DEBUG, INFO, WARN, ERROR], description: guessed from the words in the line}
              source: {type: string, example: btv-hd/input-1, description: 'process (<slug>/input-N, <slug>/packager) or agent'}
              text: {type: string}
    ProbeRequest:
      type: object
      required: [type, url]
      description: The fields of an InputDef the probe uses; other InputDef fields are ignored.
      properties:
        type: {$ref: '#/components/schemas/InputType'}
        url: {type: string, maxLength: 2000, example: 'http://localhost:9001/a.ts', description: 'SEC-07: network protocols only'}
        timeoutSec: {type: integer, default: 5, minimum: 1, maximum: 120, description: 'Network timeout, never longer than the probe limit (9 s)'}
        options:
          type: object
          properties:
            userAgent: {type: string, maxLength: 200, description: HTTP_TS / HLS only}
            rtspTransport: {type: string, enum: [tcp, udp], description: RTSP only}
          additionalProperties: true
    ProbeResult:
      type: object
      properties:
        format: {type: string, example: mpegts}
        formatName: {type: string, example: 'MPEG-TS (MPEG-2 Transport Stream)'}
        bitrate: {type: integer, format: int64, nullable: true, description: bit/s}
        programs:
          type: array
          items:
            type: object
            properties:
              pnr: {type: integer}
              serviceName: {type: string}
              provider: {type: string}
              pmtPid: {type: integer}
              pcrPid: {type: integer}
              streams: {type: array, items: {type: integer}, description: indexes into streams}
        streams:
          type: array
          items:
            type: object
            properties:
              index: {type: integer}
              pid: {type: integer, nullable: true}
              type: {type: string, enum: [VIDEO, AUDIO, SUBTITLE, DATA, OTHER]}
              codec: {type: string, example: h264}
              codecName: {type: string}
              profile: {type: string}
              lang: {type: string}
              bitrate: {type: integer, format: int64}
              width: {type: integer}
              height: {type: integer}
              fps: {type: number}
              channels: {type: integer}
              channelLayout: {type: string}
              sampleRate: {type: integer}
        video:
          type: object
          nullable: true
          properties:
            codec: {type: string}
            profile: {type: string}
            width: {type: integer}
            height: {type: integer}
            fps: {type: number}
            bitrate: {type: integer, format: int64}
        audio:
          type: array
          items:
            type: object
            properties:
              codec: {type: string}
              profile: {type: string}
              lang: {type: string}
              channels: {type: integer}
              sampleRate: {type: integer}
              bitrate: {type: integer, format: int64}
        probeMs: {type: integer, format: int64}
    ProbeProblem:
      allOf:
        - {$ref: '#/components/schemas/Problem'}
        - type: object
          properties:
            code:
              type: string
              enum: [TIMEOUT, CONNECTION_REFUSED, HOST_NOT_FOUND, NETWORK_UNREACHABLE, NOT_FOUND, ACCESS_DENIED,
                     HTTP_ERROR, INVALID_DATA, NO_STREAMS, PROTOCOL_NOT_ALLOWED, FAILED, FFPROBE_MISSING]
            reason: {type: string, example: Connection refused, description: "ffprobe's last error line"}
            probeMs: {type: integer, format: int64}
    AnalyzerSnapshot:
      type: object
      description: |
        What the TS analyzer of the agent measures on the active input (TVR-026, FR-ANL-01/05). Comes with the
        status reports (every 5 s); `at = null` means no data (stopped, starting, or no report for 30 s).
        PCR jitter, programs/SDT names and video resolution come with later analyzer tickets.
      properties:
        streamId: {type: string, format: uuid}
        nodeId: {type: string, format: uuid, nullable: true}
        activeInputId: {type: string, format: uuid, nullable: true}
        at: {type: string, format: date-time, nullable: true}
        bitrate: {type: integer, format: int64, description: bit/s of the whole TS}
        ccErrorsPerMin: {type: integer, format: int64}
        scrambled: {type: boolean}
        pids:
          type: array
          items: {$ref: '#/components/schemas/AnalyzerPid'}
        video:
          allOf: [{$ref: '#/components/schemas/AnalyzerPid'}]
          nullable: true
          description: the first video PID
        audio:
          type: array
          items: {$ref: '#/components/schemas/AnalyzerPid'}
    AnalyzerPid:
      type: object
      properties:
        pid: {type: integer}
        type: {type: string, enum: [VIDEO, AUDIO, SUBTITLE, DATA, PSI]}
        codec: {type: string, nullable: true, example: h264}
        language: {type: string, nullable: true, example: bul}
        bitrate: {type: integer, format: int64}
        ccErrors: {type: integer, format: int64, description: in the agent's measurement window (5 s)}
        scrambled: {type: boolean}
    Package:
      type: object
      required: [name]
      properties:
        id: {type: string, format: uuid, readOnly: true}
        name: {type: string}
        description: {type: string}
        active: {type: boolean}
        streamCount: {type: integer, readOnly: true}
        subscriberCount: {type: integer, readOnly: true}
    SubscriberStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, EXPIRED, BANNED]
    Subscriber:
      type: object
      required: [username]
      properties:
        id: {type: string, format: uuid, readOnly: true}
        username: {type: string}
        password: {type: string, writeOnly: true}
        fullName: {type: string}
        phone: {type: string}
        email: {type: string, format: email}
        status: {$ref: '#/components/schemas/SubscriberStatus'}
        expiresAt: {type: string, format: date}
        maxConnections: {type: integer, default: 1, minimum: 1, maximum: 10}
        limitPolicy: {type: string, enum: [REJECT_NEW, KICK_OLDEST], default: REJECT_NEW}
        packageIds: {type: array, items: {type: string, format: uuid}}
        allowedIps: {type: array, items: {type: string, example: '10.0.0.0/24'}}
        allowedCountries: {type: array, items: {type: string, example: BG}}
        note: {type: string}
        token: {type: string, readOnly: true}
        playlistUrl: {type: string, format: uri, readOnly: true}
        activeSessions: {type: integer, readOnly: true}
    Session:
      type: object
      properties:
        sessionKey: {type: string}
        subscriberId: {type: string, format: uuid}
        username: {type: string}
        streamId: {type: string, format: uuid}
        streamName: {type: string}
        ip: {type: string}
        country: {type: string}
        userAgent: {type: string}
        edgeNode: {type: string}
        protocol: {type: string, enum: [HLS, HTTP_TS]}
        startedAt: {type: string, format: date-time}
        bytesSent: {type: integer}
    Node:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        role: {type: string, enum: [INGEST, EDGE, ALL_IN_ONE]}
        publicHost: {type: string}
        status: {type: string, enum: [ONLINE, OFFLINE, DRAIN]}
        maxStreams: {type: integer}
        agentVersion: {type: string}
        ffmpegVersion: {type: string}
        metrics:
          type: object
          properties:
            cpu: {type: number}
            ramUsed: {type: integer}
            ramTotal: {type: integer}
            netInBps: {type: integer}
            netOutBps: {type: integer}
            streams: {type: integer}
        lastSeenAt: {type: string, format: date-time}
        connected: {type: boolean, description: 'Open gRPC stream from the agent right now'}
    DashboardSummary:
      type: object
      properties:
        streams:
          type: object
          properties:
            total: {type: integer}
            online: {type: integer}
            degraded: {type: integer}
            offline: {type: integer}
            stopped: {type: integer}
        viewersNow: {type: integer}
        viewersPeakToday: {type: integer}
        egressBps: {type: integer}
        subscribers:
          type: object
          properties:
            active: {type: integer}
            expiringIn7d: {type: integer}
        nodes:
          type: object
          properties:
            online: {type: integer}
            total: {type: integer}
        firingAlerts: {type: integer}
