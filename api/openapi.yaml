openapi: 3.1.0
info:
  title: TvRestream Admin API
  version: 0.1.0
  description: |
    REST API of tvr-core. The Admin UI uses the same API.
    Draft contract — v0.1 (concept). See docs/bg/05-api.md / docs/en/05-api.md.
servers:
  - url: https://admin.example.com/api/v1
security:
  - bearerAuth: []
  - apiKey: []
tags:
  - name: auth
  - name: streams
  - name: categories
  - name: packages
  - name: subscribers
  - name: sessions
  - name: nodes
  - name: monitoring
  - name: settings
  - name: playlists
    description: Subscriber endpoints on the edge domain (document 05 §3), outside /api/v1
paths:
  /auth/login:
    post:
      tags: [auth]
      security: []
      description: |
        Вход на администратор (TVR-006). Access токенът (JWT, 15 мин) е в тялото; refresh токенът
        (7 дни) е само в httpOnly бисквитка `tvr_refresh` (SameSite=Strict, Path=/api/v1/auth).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string}
                totp: {type: string, pattern: '^[0-9]{6}$', description: 'от TVR-073 (2FA)'}
      responses:
        '200':
          description: Tokens
          headers:
            Set-Cookie: {schema: {type: string}, description: 'tvr_refresh=…; HttpOnly; SameSite=Strict; Path=/api/v1/auth'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenPair'}
        '401': {$ref: '#/components/responses/Problem'}
  /auth/refresh:
    post:
      tags: [auth]
      security: []
      description: Ротира refresh токена от бисквитката `tvr_refresh`. Повторна употреба на стар токен отнема всички сесии.
      responses:
        '200':
          description: Tokens (+ нова бисквитка)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenPair'}
        '401': {$ref: '#/components/responses/Problem'}
  /auth/logout:
    post:
      tags: [auth]
      security: []
      description: Отнема refresh токена от бисквитката и я изчиства.
      responses:
        '204': {description: Logged out}
  /auth/me:
    get:
      tags: [auth]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserInfo'}
        '401': {$ref: '#/components/responses/Problem'}

  /streams:
    get:
      tags: [streams]
      description: |
        List of channels (any admin role). Sortable by name, slug, lcn, enabled, createdAt, updatedAt
        (default name,asc). `status` filters by the runtime state reported by the agent (TVR-020); an
        unknown value is 400.
      parameters:
        - {name: status, in: query, schema: {$ref: '#/components/schemas/StreamState'}}
        - {name: categoryId, in: query, schema: {type: string, format: uuid}}
        - {name: nodeId, in: query, schema: {type: string, format: uuid}}
        - {name: enabled, in: query, schema: {type: boolean}}
        - {name: mode, in: query, schema: {type: string, enum: [ALWAYS_ON, ON_DEMAND]}}
        - {name: packageId, in: query, description: 'Channels of this package (TVR-038); an unknown id gives an empty list', schema: {type: string, format: uuid}}
        - {name: q, in: query, description: 'Part of the name or slug (case-insensitive), or an exact LCN', schema: {type: string}}
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/sort'
      responses:
        '200':
          description: Page of streams
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/Stream'}
        '400': {$ref: '#/components/responses/Problem'}
    post:
      tags: [streams]
      description: Create a channel with its inputs and outputs (ADMIN, OPERATOR). 409 when the slug is taken.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StreamInput'}
      responses:
        '201':
          description: Created (Location header = /api/v1/streams/{id})
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Stream'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /streams/{id}:
    parameters: [{$ref: '#/components/parameters/id'}]
    get:
      tags: [streams]
      responses:
        '200':
          description: Stream
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Stream'}
        '404': {$ref: '#/components/responses/Problem'}
    put:
      tags: [streams]
      description: |
        Full update. Inputs/outputs with an id are updated, without an id created, missing ones removed.
        version must be the current one (else 409); it grows by 1 with every effective change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/StreamInput'
                - type: object
                  required: [version]
                  properties:
                    version: {type: integer}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Stream'}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
    delete:
      tags: [streams]
      description: Soft delete (BR-02) — the channel disappears from the API and its slug becomes free.
      responses:
        '204': {description: Soft-deleted}
        '404': {$ref: '#/components/responses/Problem'}
  /streams/{id}/actions/{action}:
    parameters:
      - $ref: '#/components/parameters/id'
      - name: action
        in: path
        required: true
        schema: {type: string, enum: [start, stop, restart]}
    post:
      tags: [streams]
      description: |
        FR-STR-05 (TVR-021). `start` / `stop` set `enabled` (the channel stays started or stopped after restarts
        of core and agent; the version grows unless it already was in that state). `restart` sends a restart
        command to the agent that runs the channel; nothing changes in the database. ADMIN or OPERATOR.
      responses:
        '202':
          description: Accepted; the channel as it is now (the agent applies the action within 1–3 s)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Stream'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: restart of a stopped channel, of a channel without a node, or whose node is not connected
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /streams/{id}/logo:
    parameters: [{$ref: '#/components/parameters/id'}]
    put:
      tags: [streams]
      summary: Upload the channel logo (FR-PLY-04, TVR-047) — ADMIN/OPERATOR
      description: |
        PNG, or SVG without scripts, event handlers, `javascript:`, embedded HTML, entities or links to other
        addresses; at most 512 KB. Replaces the previous upload. Does not change the channel: put the returned
        `logoUrl` into the channel's `logoUrl` and save it (PUT /streams/{id}); saving another address drops the file.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '200':
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  logoUrl: {type: string, example: '/logos/0b6e2a4c-1d2f-4e5a-9b7c-3d8e9f0a1b2c.png?v=0123abcd'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /logos/{file}:
    servers:
      - url: https://tv.example.com
        description: the edge domain (cached there); also the origin and the panel nginx, served by tvr-core
    get:
      tags: [streams]
      security: []
      summary: An uploaded channel logo (TVR-047) — public, served through the edge
      description: |
        `{file}` = `{streamId}.png` or `{streamId}.svg`. With the current `?v=` the answer is cacheable for a year
        (`immutable`); `ETag` = SHA-256, `If-None-Match` → 304. SVG comes with a sandboxing
        `Content-Security-Policy` and `X-Content-Type-Options: nosniff`.
      parameters:
        - {name: file, in: path, required: true, schema: {type: string, example: '0b6e2a4c-1d2f-4e5a-9b7c-3d8e9f0a1b2c.png'}}
        - {name: v, in: query, schema: {type: string}}
      responses:
        '200':
          description: The image
          content:
            image/png: {schema: {type: string, format: binary}}
            image/svg+xml: {schema: {type: string}}
        '304': {description: Not modified}
        '404': {description: No such logo}
  /streams/{id}/logs:
    parameters: [{$ref: '#/components/parameters/id'}]
    get:
      tags: [streams]
      summary: Last lines of the channel log (FR-LOG-01, TVR-023)
      description: |
        core asks the agent of the channel's node (gRPC `FetchLogs`) and waits up to 5 s
        (`tvr.grpc.logs-timeout`). The agent keeps the last 1 000 lines per channel (FFmpeg output and its own
        events: start, exit, restart), also after the channel stops, until the agent restarts. URLs in the lines
        are redacted (password, token). ADMIN or OPERATOR.
      parameters:
        - {name: tail, in: query, schema: {type: integer, default: 500, minimum: 1, maximum: 1000}}
      responses:
        '200':
          description: The lines, oldest first
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StreamLog'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: the channel has no node, or its node is not connected
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '504':
          description: the agent did not answer within 5 s
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /streams/{id}/actions/switch-input:
    parameters: [{$ref: '#/components/parameters/id'}]
    post:
      tags: [streams]
      summary: Manual input switch, with or without pin (FR-FOV-06, TVR-036)
      description: |
        Sends `SwitchInput` to the agent of the channel's node: the input becomes active now (FAILOVER event with
        `data.manual = true`, `data.pinned`). `pin = true` suspends the automatic failover — the pinned input stays
        active even without data — until a switch with `pin = false`; the active input with `pin = false` only
        clears the pin. The pin is not stored: a restart of the channel (or of the agent, or a change of its
        settings) clears it. `status.inputPinned` shows it. ADMIN or OPERATOR.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputId]
              properties:
                inputId: {type: string, format: uuid, description: an enabled input of this channel}
                pin: {type: boolean, default: false}
      responses:
        '202':
          description: Accepted; the channel as it is now (the agent switches within 1–3 s)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Stream'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404':
          description: no such channel, or the channel has no such input
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '409':
          description: the input is disabled, the channel is stopped, has no node, or its node is not connected
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /streams/{id}/analyzer:
    parameters: [{$ref: '#/components/parameters/id'}]
    get:
      tags: [streams]
      responses:
        '200':
          description: Live analyzer snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnalyzerSnapshot'}
  /streams/{id}/events:
    parameters: [{$ref: '#/components/parameters/id'}]
    get:
      tags: [streams]
      summary: History of the channel's events, newest first (FR-FOV-07, TVR-029)
      description: |
        FAILOVER (data.from / data.to = input ids, from_index / to_index, reason), STATUS (every change of the
        state, data.from / data.to), and the other events the agent reports (PROCESS_EXITED, INPUT_LOST…).
        Kept for 180 days (monthly partitions). Any admin role.
      parameters:
        - {name: type, in: query, description: 'Event types, repeated or comma-separated (e.g. FAILOVER,STATUS)', schema: {type: array, items: {type: string}}, style: form, explode: true}
        - {name: from, in: query, description: 'Only events at or after this instant', schema: {type: string, format: date-time}}
        - {name: to, in: query, description: 'Only events before this instant', schema: {type: string, format: date-time}}
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: Page of events
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/StreamEvent'}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /inputs/probe:
    post:
      tags: [streams]
      summary: Test an input with ffprobe before saving it (FR-INP-07, TVR-022)
      description: |
        Runs ffprobe on the tvr-core host with a hard limit of 9 s (the response arrives within 10 s).
        ADMIN and OPERATOR only. Accepts an InputDef; only type, url, timeoutSec and
        options.userAgent / options.rtspTransport are used. DVB inputs cannot be probed.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProbeRequest'}
      responses:
        '200':
          description: Probe result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProbeResult'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422':
          description: The input could not be read; `code` says why
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProbeProblem'}
        '429': {$ref: '#/components/responses/Problem'}
        '503':
          description: ffprobe is not installed on the server (`code` FFPROBE_MISSING)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProbeProblem'}

  /categories:
    get:
      tags: [categories]
      description: All categories in display order (sortOrder, then name). Any admin role.
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Category'}
    post:
      tags: [categories]
      description: |
        Create a category (ADMIN, OPERATOR). Without sortOrder it goes last.
        409 when the name is taken (ignoring case).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CategoryInput'}
      responses:
        '201':
          description: Created (Location header = /api/v1/categories/{id})
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Category'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /categories/order:
    put:
      tags: [categories]
      description: |
        New order of all categories (drag and drop): ids of every category exactly once; position i gets
        sortOrder = i. A missing, unknown or repeated id → 400 (errors[].field = "[i]" or "").
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: {type: string, format: uuid}
      responses:
        '200':
          description: Categories in the new order
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Category'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /categories/{id}:
    parameters: [{$ref: '#/components/parameters/id'}]
    get:
      tags: [categories]
      responses:
        '200':
          description: Category
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Category'}
        '404': {$ref: '#/components/responses/Problem'}
    put:
      tags: [categories]
      description: Update the name and optionally sortOrder (kept when omitted). 409 when the name is taken.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CategoryInput'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Category'}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
    delete:
      tags: [categories]
      description: Delete the category; its channels stay, without a category.
      responses:
        '204': {description: Deleted}
        '404': {$ref: '#/components/responses/Problem'}

  /packages:
    get:
      tags: [packages]
      description: All packages by name (any admin role; TVR-038).
      responses:
        '200':
          description: Packages
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Package'}
    post:
      tags: [packages]
      description: Create a package (ADMIN/OPERATOR). 409 when the name is taken (ignoring case).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PackageInput'}
      responses:
        '201':
          description: Created; `Location` points to the package
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Package'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /packages/{id}:
    parameters: [{$ref: '#/components/parameters/id'}]
    get:
      tags: [packages]
      responses:
        '200':
          description: Package
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Package'}
        '404': {$ref: '#/components/responses/Problem'}
    put:
      tags: [packages]
      description: Update name and description; `active` is kept when omitted. 409 when the name is taken.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PackageInput'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Package'}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
    delete:
      tags: [packages]
      description: |
        Delete the package with its channel and subscriber links; the channels stay. A package that subscribers
        have is deleted only with `force=true`, otherwise 409 with `code = PACKAGE_HAS_SUBSCRIBERS` and
        `subscriberCount`.
      parameters:
        - {name: force, in: query, schema: {type: boolean, default: false}}
      responses:
        '204': {description: Deleted}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /packages/{id}/streams:
    parameters: [{$ref: '#/components/parameters/id'}]
    get:
      tags: [packages]
      description: Channels (not deleted) of the package in package order.
      responses:
        '200':
          description: Channels in order
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PackageStream'}
        '404': {$ref: '#/components/responses/Problem'}
    put:
      tags: [packages]
      description: |
        Replace the channels of the package (add, remove and reorder at once; ADMIN/OPERATOR). The order follows
        `sortOrder`; an item without it takes its array index; stored as 0, 1, 2… Every `streamId` at most once and
        of a channel that is not deleted (400 with `errors[i].streamId`); up to 2000 items. Soft-deleted channels
        already in the package keep their link. Returns the stored list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 2000
              items:
                type: object
                required: [streamId]
                properties:
                  streamId: {type: string, format: uuid}
                  sortOrder: {type: integer, minimum: 0, maximum: 100000}
      responses:
        '200':
          description: The channels in the stored order
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PackageStream'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}

  /subscribers:
    get:
      tags: [subscribers]
      description: |
        Page of subscribers (ADMIN/OPERATOR/SUPPORT; TVR-039). `q` — part of username, full name, phone or e-mail
        (case-insensitive), or a full token. `expiresBefore` — expiry on or before that day (inclusive).
        Sortable by username (default), fullName, status, expiresAt, createdAt, updatedAt; no date sorts last.
      parameters:
        - {name: status, in: query, schema: {$ref: '#/components/schemas/SubscriberStatus'}}
        - {name: packageId, in: query, schema: {type: string, format: uuid}}
        - {name: expiresBefore, in: query, schema: {type: string, format: date}}
        - {name: q, in: query, schema: {type: string}}
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/sort'
      responses:
        '200':
          description: Page of subscribers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/Subscriber'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [subscribers]
      description: Create; the status is ACTIVE and a 32-character token is generated. 409 when the username is taken.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubscriberInput'}
      responses:
        '201':
          description: Created; `Location` points to the subscriber
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Subscriber'}
        '400': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /subscribers/{id}:
    parameters: [{$ref: '#/components/parameters/id'}]
    get:
      tags: [subscribers]
      responses:
        '200':
          description: Subscriber
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Subscriber'}
        '404': {$ref: '#/components/responses/Problem'}
    put:
      tags: [subscribers]
      description: |
        Full update. Text fields are the new state (null clears them); password, packageIds, maxConnections,
        limitPolicy, allowedIps and allowedCountries are kept when null; an empty password removes it. An expiry
        date may stay in the past only when unchanged. An EXPIRED subscriber with a new date from today on (or none)
        becomes ACTIVE.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubscriberInput'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Subscriber'}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
    delete:
      tags: [subscribers]
      description: Hard delete with packages links and devices (ADMIN only).
      responses:
        '204': {description: Deleted}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /subscribers/actions/expire:
    post:
      tags: [subscribers]
      summary: Run the nightly expiry now (BR-01, TVR-046) — ADMIN
      description: |
        The same job runs every day at 00:00 Europe/Sofia and at core start: ACTIVE subscribers whose last day
        (`expiresAt`) is before today become EXPIRED, each with an `EXPIRE` history entry by the system; their cached
        access and active devices are dropped, so viewing stops (TC-06). SUSPENDED and BANNED keep their status.
        Idempotent: a second run expires nobody.
      responses:
        '200':
          description: What the run did
          content:
            application/json:
              schema:
                type: object
                properties:
                  today: {type: string, format: date, description: 'today in Europe/Sofia'}
                  expired: {type: integer, description: number of subscribers marked EXPIRED}
        '403': {$ref: '#/components/responses/Problem'}
  /subscribers/{id}/actions/extend:
    parameters: [{$ref: '#/components/parameters/id'}]
    post:
      tags: [subscribers]
      description: |
        Exactly one of `days` (1–3650, added to the current expiry, or to today when it has passed or is not set)
        and `until` (the new last day, not in the past). An EXPIRED subscriber becomes ACTIVE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                days: {type: integer, minimum: 1, maximum: 3650}
                until: {type: string, format: date}
      responses:
        '200':
          description: The subscriber with the new date
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Subscriber'}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /subscribers/{id}/actions/{action}:
    parameters:
      - {$ref: '#/components/parameters/id'}
      - {name: action, in: path, required: true, schema: {type: string, enum: [suspend, resume, ban, regenerate-token]}}
    post:
      tags: [subscribers]
      description: |
        `suspend`: ACTIVE → SUSPENDED (409 for EXPIRED/BANNED). `resume`: SUSPENDED → ACTIVE (EXPIRED if the date has
        passed); BANNED → ACTIVE only for ADMIN (403 otherwise); 409 for EXPIRED — use extend. `ban`: any → BANNED.
        `regenerate-token`: a new token, the old one stops working at once (FR-SUB-05). Repeating an action on the
        status it leads to changes nothing. Every action drops the cached access `auth:<token>` in Redis.
      responses:
        '200':
          description: The subscriber as it is now (with `token` and `playlistUrl`)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Subscriber'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /subscribers/{id}/history:
    parameters: [{$ref: '#/components/parameters/id'}]
    get:
      tags: [subscribers]
      summary: History of the subscriber from the audit log, newest first (FR-AUD-01, TVR-040)
      description: |
        Every change through the API is written to `audit_log` in the same transaction: CREATE, UPDATE (only
        when something changed), DELETE, EXTEND, SUSPEND, RESUME, BAN, REGENERATE_TOKEN, and EXPIRE by the nightly job
        (TVR-046, actor `null` = system) — with the admin, the IP
        and `diff` = what changed (`{field: {from, to}}`; packages as `{added, removed}` names; a password only as
        `{changed, set}`). Tokens and passwords never go in. ADMIN, OPERATOR and SUPPORT; size defaults to 20.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: Page of history entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/AuditEntry'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}

  /pl/{token}.m3u:
    servers:
      - url: https://tv.example.com
        description: the edge domain (TVR_PLAYBACK_BASE_URL); in dev the nginx origin http://localhost:8081
    get:
      tags: [playlists]
      security: []
      summary: Personal M3U playlist (FR-PLY-01/02/05, TVR-041)
      description: |
        Public — the token in the path is the credential. Built on every request: the channels of the subscriber's
        active packages, each once, not deleted, enabled or on demand, with a public enabled output of the chosen
        type; ordered by LCN, channels without a number after them by name. Each entry is
        `#EXTINF:-1 tvg-id="{epgId|slug}" tvg-name tvg-logo group-title="{category}" tvg-chno="{lcn}",{name}`
        followed by `{base}/live/{slug}/index.m3u8?token={token}` (HLS) or `{base}/ts/{slug}.ts?token={token}`
        (`type=ts`). Only ACTIVE subscribers whose last day has not passed get a playlist. Plain-text errors (no
        problem+json): players show them as they are. `Cache-Control: no-store`.
      parameters:
        - {name: token, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z0-9]{32}$'}}
        - {name: type, in: query, schema: {type: string, enum: [hls, ts], default: hls}}
      responses:
        '200':
          description: The playlist; `text/plain` when the request accepts text/html (a browser)
          content:
            audio/x-mpegurl:
              schema: {type: string}
              example: |
                #EXTM3U
                #EXTINF:-1 tvg-id="btv-hd" tvg-name="bTV HD" tvg-logo="https://tv.example.com/logos/btv.png" group-title="Общи" tvg-chno="3",bTV HD
                https://tv.example.com/live/btv-hd/index.m3u8?token=a8Kf3xQ9mZ2LwP7sR4tY1uV6bN0cD5eH
            text/plain:
              schema: {type: string}
        '400': {description: '`type` is not hls or ts', content: {text/plain: {schema: {type: string}}}}
        '403': {description: Suspended, banned or expired, content: {text/plain: {schema: {type: string}}}}
        '404': {description: No subscriber with this token (also the old token after regenerate-token), content: {text/plain: {schema: {type: string}}}}

  /internal/auth:
    servers:
      - url: http://tvr-core:8080
        description: core itself — called only by the nginx edge (auth_request), never by players
    get:
      tags: [playlists]
      security: []
      summary: Playback check of the edge (FR-AUT-01/03, TVR-042)
      description: |
        Token and channel come from `X-Original-URI` (`/live/{slug}/index.m3u8?token=` or `/ts/{slug}.ts?token=`);
        `token`, `slug`, `ip` query parameters are a fallback for manual checks. Checks in order: token → status →
        last day → channel in an active package (not deleted) → client IP in the allow list → device limit (TVR-045).
        Rights are cached in Redis `auth:<token>` for 10 s; every change of the subscriber drops the key.
        A device is subscriber + `X-Real-IP` + `User-Agent` (BR-06); it counts as watching for 30 s after its last
        allowed request (FR-SES-03). A new device over `maxConnections` gets 403 `LIMIT` (`REJECT_NEW`), or the
        device that started first is closed and kept out for 2 min (`KICK_OLDEST`). Empty body. With
        `tvr.access.internal-token` set, a request without the matching `X-Internal-Token` gets 404.
      parameters:
        - {name: X-Original-URI, in: header, schema: {type: string, example: '/live/btv-hd/index.m3u8?token=a8Kf3xQ9mZ2LwP7sR4tY1uV6bN0cD5eH'}}
        - {name: X-Real-IP, in: header, schema: {type: string}}
        - {name: User-Agent, in: header, description: "the player's user agent (part of the device, TVR-045)", schema: {type: string}}
        - {name: X-Internal-Token, in: header, schema: {type: string}}
        - {name: token, in: query, schema: {type: string}}
        - {name: slug, in: query, schema: {type: string}}
        - {name: ip, in: query, schema: {type: string}}
      responses:
        '200':
          description: Allowed
          headers:
            X-Subscriber-Id: {schema: {type: string, format: uuid}}
            X-Session-Id: {description: 'the device: 22 base64url characters, hash of subscriber, IP and user agent (TVR-045)', schema: {type: string}}
            X-Sign-Expires: {description: 'epoch seconds; now + tvr.access.sign-ttl (60 s). Informational: the edge signs segments with its own TVR_SIGN_TTL, because a cached answer carries an old time (TVR-044)', schema: {type: integer}}
        '401':
          description: No, malformed or unknown token
          headers:
            X-Deny-Reason: {schema: {type: string, enum: [TOKEN]}}
        '403':
          description: Refused
          headers:
            X-Deny-Reason: {schema: {type: string, enum: [EXPIRED, SUSPENDED, BANNED, NOT_IN_PACKAGE, IP, LIMIT]}}
        '404': {description: 'X-Internal-Token missing or wrong (when configured)'}

  /sessions:
    get:
      tags: [sessions]
      parameters:
        - {name: streamId, in: query, schema: {type: string, format: uuid}}
        - {name: subscriberId, in: query, schema: {type: string, format: uuid}}
        - {name: nodeId, in: query, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Active sessions
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Session'}
  /sessions/{sessionKey}:
    delete:
      tags: [sessions]
      parameters:
        - {name: sessionKey, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: Kicked}

  /nodes:
    get:
      tags: [nodes]
      description: |
        Servers by name (any admin role). status becomes ONLINE on the agent's Hello and OFFLINE 15 s after
        the last heartbeat (FR-NOD-02); connected = the agent has an open gRPC stream right now (TVR-017);
        metrics = the agent's last NodeMetrics, kept 30 s in Redis (TVR-035).
      responses:
        '200':
          description: Nodes
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Node'}
  /nodes/enrollment-tokens:
    post:
      tags: [nodes]
      responses:
        '201':
          description: One-time enrollment token (valid 1h)
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: {type: string}
                  installCommand: {type: string}
                  expiresAt: {type: string, format: date-time}

  /dashboard/summary:
    get:
      tags: [monitoring]
      summary: Dashboard counters, problem channels, latest events (TVR-034); any admin role
      responses:
        '200':
          description: Dashboard counters
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DashboardSummary'}
  /events:
    get:
      tags: [monitoring]
      summary: Real-time events (Server-Sent Events, TVR-030)
      description: |
        Stream of `event:` / `data:` pairs. First `ready` ({at, until, types}), then
        `stream.status` (LiveStreamStatus), `stream.failover` and `stream.event` (LiveStreamEvent),
        `node.status` (LiveNodeStatus), `node.metrics` (LiveNodeMetrics); `: ping` every 15 s when idle.
        Ends with `bye` ({reason: token-expired | max-duration | slow-client | shutdown}) — reconnect with a
        fresh token and reload through REST (no replay). Any admin role. The token may also be given as
        `?access_token=` (EventSource cannot send headers); only on this path. Later: `session.count`, `alert`.
      security:
        - bearerAuth: []
        - accessTokenQuery: []
      parameters:
        - name: types
          in: query
          description: Comma separated event types or groups (`stream.*`, `node.*`); default all
          schema: {type: string, example: "stream.status,node.*"}
      responses:
        '200':
          description: SSE
          content:
            text/event-stream:
              schema: {type: string}
              example: |
                event:ready
                data:{"at":"2026-10-28T18:01:09Z","until":"2026-10-28T18:16:09Z","types":["stream.status"]}
                retry:3000

                event:stream.status
                data:{"streamId":"6e427630-522c-4d8b-9161-d873f424f7f0","state":"STOPPED","previousState":"ONLINE","changed":true,"activeInputId":null,"bitrateIn":0,"since":"2026-10-28T18:01:23Z","lastError":"stopped via the API","nodeId":"11246e35-e0bd-48f5-ad98-18b91503f60b","at":"2026-10-28T18:01:23Z"}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {description: Missing or invalid token}
        '503': {description: Too many open streams on this core instance (tvr.live.max-clients) or core is stopping}

  /settings:
    get:
      tags: [settings]
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
    put:
      tags: [settings]
      requestBody:
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        '200': {description: Saved}
  /import/m3u:
    post:
      tags: [settings]
      parameters:
        - {name: commit, in: query, schema: {type: boolean, default: false}}
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: {type: string, format: binary}
                url: {type: string, format: uri}
      responses:
        '200': {description: Preview or import result}

components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
    apiKey: {type: apiKey, in: header, name: X-API-Key}
    accessTokenQuery: {type: apiKey, in: query, name: access_token, description: "Access token in the URL — GET /events only (TVR-030)"}
  parameters:
    id: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    page: {name: page, in: query, schema: {type: integer, default: 0, minimum: 0}}
    size: {name: size, in: query, schema: {type: integer, default: 50, maximum: 500}}
    sort: {name: sort, in: query, schema: {type: string, example: 'name,asc'}}
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Problem:
      type: object
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        errors:
          type: array
          items:
            type: object
            properties:
              field: {type: string, example: 'inputs[0].url'}
              message: {type: string, example: 'Неподдържан протокол'}
    TokenPair:
      type: object
      properties:
        accessToken: {type: string}
        tokenType: {type: string, example: Bearer}
        expiresIn: {type: integer, description: секунди, example: 900}
        user: {$ref: '#/components/schemas/UserInfo'}
    UserInfo:
      type: object
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        role: {type: string, enum: [ADMIN, OPERATOR, SUPPORT, VIEWER]}
    AuditEntry:
      type: object
      description: "A row of audit_log (V6, TVR-040); the audit screen with filters comes with TVR-074."
      properties:
        id: {type: integer, format: int64}
        ts: {type: string, format: date-time}
        actorId: {type: string, format: uuid, nullable: true, description: 'null = the system (jobs)'}
        actorEmail: {type: string, nullable: true, description: 'e-mail of the admin at the time of the change'}
        action: {type: string, enum: [CREATE, UPDATE, DELETE, EXTEND, SUSPEND, RESUME, BAN, REGENERATE_TOKEN]}
        entityType: {type: string, example: subscriber}
        entityId: {type: string}
        diff:
          type: object
          additionalProperties: true
          example: {days: 30, expiresAt: {from: '2026-11-01', to: '2026-12-01'}}
    PageMeta:
      type: object
      properties:
        page: {type: integer}
        size: {type: integer}
        total: {type: integer}
    LiveStreamStatus:
      type: object
      description: "data of `stream.status` (TVR-030)"
      properties:
        streamId: {type: string, format: uuid}
        state: {$ref: '#/components/schemas/StreamState'}
        previousState: {$ref: '#/components/schemas/StreamState'}
        changed: {type: boolean, description: 'new state, new active input or a new pin with this report'}
        activeInputId: {type: string, format: uuid, nullable: true}
        inputPinned: {type: boolean, description: 'the active input is pinned by an operator (TVR-036)'}
        bitrateIn: {type: integer, format: int64}
        since: {type: string, format: date-time}
        lastError: {type: string, nullable: true}
        nodeId: {type: string, format: uuid}
        at: {type: string, format: date-time}
    LiveStreamEvent:
      type: object
      description: "data of `stream.failover` (type FAILOVER) and `stream.event` (TVR-030)"
      properties:
        streamId: {type: string, format: uuid}
        type: {type: string, example: FAILOVER}
        nodeId: {type: string, format: uuid}
        inputId: {type: string, format: uuid, nullable: true}
        message: {type: string, nullable: true}
        data: {type: object, additionalProperties: true}
        at: {type: string, format: date-time}
    LiveNodeStatus:
      type: object
      description: "data of `node.status` (TVR-030)"
      properties:
        nodeId: {type: string, format: uuid}
        name: {type: string}
        status: {type: string, enum: [ONLINE, OFFLINE, DRAIN]}
        lastSeenAt: {type: string, format: date-time, nullable: true}
        at: {type: string, format: date-time}
    LiveNodeMetrics:
      type: object
      description: "data of `node.metrics` (TVR-030); the agent sends them every 5 s (TVR-035). Also `Node.metrics`."
      properties:
        nodeId: {type: string, format: uuid}
        at: {type: string, format: date-time}
        cpuPercent: {type: number, description: '0–100 for the whole machine; -1 = not measured yet'}
        memUsedBytes: {type: integer, format: int64}
        memTotalBytes: {type: integer, format: int64}
        netRxBps: {type: integer, format: int64, description: 'All interfaces but loopback, bit/s'}
        netTxBps: {type: integer, format: int64}
        tmpfsFreeBytes: {type: integer, format: int64, description: "Free space of the agent's work directory (0 = unknown)"}
        tmpfsTotalBytes: {type: integer, format: int64}
        streamsRunning: {type: integer}
        processes: {type: integer, description: 'FFmpeg (child) processes of the agent'}
        loadAvg1m: {type: number}
        cpuCores: {type: integer}
    StreamEvent:
      type: object
      properties:
        id: {type: integer, format: int64}
        streamId: {type: string, format: uuid}
        ts: {type: string, format: date-time}
        type: {type: string, description: 'STATUS, FAILOVER, PROCESS_EXITED, INPUT_LOST, INPUT_RESTORED, STARTED, STOPPED, ERROR…', example: FAILOVER}
        nodeId: {type: string, format: uuid, nullable: true}
        inputId: {type: string, format: uuid, nullable: true, description: 'The input it is about (FAILOVER: the new one)'}
        message: {type: string, nullable: true, example: 'input #1 → #2: no data for 5s'}
        data:
          type: object
          additionalProperties: {type: string}
          example: {from: 2c505762-9c66-4877-ba44-c7af718bdc5d, to: 2aa8b6af-8b81-424e-9c61-8334cbc3cc92, from_index: '1', to_index: '2', reason: no data for 5s}
    StreamState:
      type: string
      description: 'DEGRADED = the channel plays from a backup input (not the first one by priority) after a failover'
      enum: [STOPPED, STARTING, ONLINE, DEGRADED, OFFLINE, ERROR]
    InputType:
      type: string
      enum: [HTTP_TS, HLS, UDP, SRT, RTMP, RTSP, DVB]
    OutputType:
      type: string
      enum: [HLS, HTTP_TS, UDP, SRT, RTMP]
    InputDef:
      type: object
      required: [type, url]
      properties:
        id: {type: string, format: uuid, readOnly: true}
        priority: {type: integer, minimum: 1, maximum: 8, description: 'Failover order; default = position in the array'}
        type: {$ref: '#/components/schemas/InputType'}
        url: {type: string, maxLength: 2000, example: 'http://provider/btv.ts', description: 'SEC-07: http, https, udp, rtp, srt, rtmp, rtmps, rtsp, dvb only'}
        timeoutSec: {type: integer, default: 5, minimum: 1, maximum: 120}
        hotStandby: {type: boolean, default: false}
        enabled: {type: boolean, default: true}
        options: {type: object, additionalProperties: true}
    OutputDef:
      type: object
      required: [type]
      properties:
        id: {type: string, format: uuid, readOnly: true}
        type: {$ref: '#/components/schemas/OutputType'}
        public: {type: boolean, default: true}
        enabled: {type: boolean, default: true}
        options: {type: object, additionalProperties: true}
    StreamInput:
      type: object
      required: [name, slug, inputs, outputs]
      properties:
        name: {type: string, maxLength: 120}
        slug: {type: string, pattern: '^[a-z0-9-]{2,64}$'}
        lcn: {type: integer, minimum: 1, maximum: 9999}
        categoryId: {type: string, format: uuid}
        nodeId: {type: string, format: uuid}
        logoUrl: {type: string, maxLength: 500, description: 'http(s) URL, or the path of an uploaded logo (/logos/{id}.png?v=…, TVR-047)'}
        epgId: {type: string, maxLength: 100}
        language: {type: string, maxLength: 10, example: bg}
        description: {type: string}
        tags: {type: array, maxItems: 20, items: {type: string, maxLength: 50}}
        enabled: {type: boolean, default: true}
        mode: {type: string, enum: [ALWAYS_ON, ON_DEMAND], default: ALWAYS_ON}
        processing:
          type: object
          properties:
            pnr: {type: integer}
            keepAudioLangs: {type: array, items: {type: string}}
            dropSubtitles: {type: boolean}
            serviceName: {type: string}
        inputs:
          type: array
          minItems: 1
          maxItems: 8
          items: {$ref: '#/components/schemas/InputDef'}
        outputs:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/OutputDef'}
        packageIds:
          type: array
          description: Accepted but ignored; channels are put into packages with PUT /packages/{id}/streams (TVR-038)
          items: {type: string, format: uuid}
    Stream:
      allOf:
        - $ref: '#/components/schemas/StreamInput'
        - type: object
          properties:
            id: {type: string, format: uuid}
            version: {type: integer, description: 0 after create}
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
            status:
              type: object
              description: >-
                Runtime state reported by the agent (TVR-020). STOPPED when the channel is disabled or no report
                came in the last 30 s; then the other fields are null.
              properties:
                state: {$ref: '#/components/schemas/StreamState'}
                activeInputId: {type: string, format: uuid, nullable: true}
                bitrateIn: {type: integer, format: int64, nullable: true, description: 'bits/s of the input (0 while STARTING)'}
                since: {type: string, format: date-time, nullable: true, description: when the channel entered this state}
                lastError: {type: string, nullable: true, description: 'why the channel is OFFLINE, ERROR or DEGRADED'}
                inputPinned:
                  type: boolean
                  description: >-
                    An operator pinned the active input (TVR-036, FR-FOV-06): automatic failover is suspended until
                    a switch with pin=false. A pinned backup input is ONLINE, not DEGRADED.
                viewers: {type: integer, description: Not reported yet (sessions, S5)}
            urls:
              type: object
              properties:
                hls: {type: string, format: uri}
                ts: {type: string, format: uri}
    StreamLog:
      type: object
      properties:
        streamId: {type: string, format: uuid}
        nodeId: {type: string, format: uuid, description: the node that sent the log}
        tail: {type: integer}
        found: {type: boolean, description: 'false: the agent has no log for the channel (it has not run there since the agent started)'}
        lines:
          type: array
          items:
            type: object
            properties:
              at: {type: string, format: date-time}
              level: {type: string, enum: [DEBUG, INFO, WARN, ERROR], description: guessed from the words in the line}
              source: {type: string, example: btv-hd/input-1, description: 'process (<slug>/input-N, <slug>/packager) or agent'}
              text: {type: string}
    ProbeRequest:
      type: object
      required: [type, url]
      description: The fields of an InputDef the probe uses; other InputDef fields are ignored.
      properties:
        type: {$ref: '#/components/schemas/InputType'}
        url: {type: string, maxLength: 2000, example: 'http://localhost:9001/a.ts', description: 'SEC-07: network protocols only'}
        timeoutSec: {type: integer, default: 5, minimum: 1, maximum: 120, description: 'Network timeout, never longer than the probe limit (9 s)'}
        options:
          type: object
          properties:
            userAgent: {type: string, maxLength: 200, description: HTTP_TS / HLS only}
            rtspTransport: {type: string, enum: [tcp, udp], description: RTSP only}
          additionalProperties: true
    ProbeResult:
      type: object
      properties:
        format: {type: string, example: mpegts}
        formatName: {type: string, example: 'MPEG-TS (MPEG-2 Transport Stream)'}
        bitrate: {type: integer, format: int64, nullable: true, description: bit/s}
        programs:
          type: array
          items:
            type: object
            properties:
              pnr: {type: integer}
              serviceName: {type: string}
              provider: {type: string}
              pmtPid: {type: integer}
              pcrPid: {type: integer}
              streams: {type: array, items: {type: integer}, description: indexes into streams}
        streams:
          type: array
          items:
            type: object
            properties:
              index: {type: integer}
              pid: {type: integer, nullable: true}
              type: {type: string, enum: [VIDEO, AUDIO, SUBTITLE, DATA, OTHER]}
              codec: {type: string, example: h264}
              codecName: {type: string}
              profile: {type: string}
              lang: {type: string}
              bitrate: {type: integer, format: int64}
              width: {type: integer}
              height: {type: integer}
              fps: {type: number}
              channels: {type: integer}
              channelLayout: {type: string}
              sampleRate: {type: integer}
        video:
          type: object
          nullable: true
          properties:
            codec: {type: string}
            profile: {type: string}
            width: {type: integer}
            height: {type: integer}
            fps: {type: number}
            bitrate: {type: integer, format: int64}
        audio:
          type: array
          items:
            type: object
            properties:
              codec: {type: string}
              profile: {type: string}
              lang: {type: string}
              channels: {type: integer}
              sampleRate: {type: integer}
              bitrate: {type: integer, format: int64}
        probeMs: {type: integer, format: int64}
    ProbeProblem:
      allOf:
        - {$ref: '#/components/schemas/Problem'}
        - type: object
          properties:
            code:
              type: string
              enum: [TIMEOUT, CONNECTION_REFUSED, HOST_NOT_FOUND, NETWORK_UNREACHABLE, NOT_FOUND, ACCESS_DENIED,
                     HTTP_ERROR, INVALID_DATA, NO_STREAMS, PROTOCOL_NOT_ALLOWED, FAILED, FFPROBE_MISSING]
            reason: {type: string, example: Connection refused, description: "ffprobe's last error line"}
            probeMs: {type: integer, format: int64}
    AnalyzerSnapshot:
      type: object
      description: |
        What the TS analyzer of the agent measures on the active input (TVR-026, FR-ANL-01/05). Comes with the
        status reports (every 5 s); `at = null` means no data (stopped, starting, or no report for 30 s).
        PCR jitter, programs/SDT names and video resolution come with later analyzer tickets.
      properties:
        streamId: {type: string, format: uuid}
        nodeId: {type: string, format: uuid, nullable: true}
        activeInputId: {type: string, format: uuid, nullable: true}
        at: {type: string, format: date-time, nullable: true}
        bitrate: {type: integer, format: int64, description: bit/s of the whole TS}
        ccErrorsPerMin: {type: integer, format: int64}
        scrambled: {type: boolean}
        pids:
          type: array
          items: {$ref: '#/components/schemas/AnalyzerPid'}
        video:
          allOf: [{$ref: '#/components/schemas/AnalyzerPid'}]
          nullable: true
          description: the first video PID
        audio:
          type: array
          items: {$ref: '#/components/schemas/AnalyzerPid'}
    AnalyzerPid:
      type: object
      properties:
        pid: {type: integer}
        type: {type: string, enum: [VIDEO, AUDIO, SUBTITLE, DATA, PSI]}
        codec: {type: string, nullable: true, example: h264}
        language: {type: string, nullable: true, example: bul}
        bitrate: {type: integer, format: int64}
        ccErrors: {type: integer, format: int64, description: in the agent's measurement window (5 s)}
        scrambled: {type: boolean}
    Package:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string, maxLength: 100}
        description: {type: string, nullable: true, maxLength: 1000}
        active: {type: boolean, description: an inactive package grants no access}
        streamCount: {type: integer, format: int64, description: channels (not deleted) in the package}
        subscriberCount: {type: integer, format: int64}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    PackageInput:
      type: object
      required: [name]
      properties:
        name: {type: string, maxLength: 100, description: unique ignoring case}
        description: {type: string, nullable: true, maxLength: 1000}
        active: {type: boolean, description: 'default true on create; kept when omitted on update'}
    PackageStream:
      type: object
      properties:
        streamId: {type: string, format: uuid}
        sortOrder: {type: integer, description: '0, 1, 2 … in package order'}
        name: {type: string}
        slug: {type: string}
        lcn: {type: integer, nullable: true}
        logoUrl: {type: string, nullable: true}
        enabled: {type: boolean}
        categoryId: {type: string, format: uuid, nullable: true}
    SubscriberStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, EXPIRED, BANNED]
    SubscriberInput:
      type: object
      required: [username]
      properties:
        username: {type: string, pattern: '^[A-Za-z0-9._@-]{3,64}$', description: unique ignoring case}
        password: {type: string, writeOnly: true, minLength: 6, maxLength: 128, description: 'Xtream-like access; "" removes it'}
        fullName: {type: string, maxLength: 150, nullable: true}
        phone: {type: string, pattern: '^[0-9+()\- ]{3,32}$', nullable: true}
        email: {type: string, format: email, maxLength: 254, nullable: true}
        expiresAt: {type: string, format: date, nullable: true, description: 'last day of access (Europe/Sofia); null = never expires'}
        maxConnections: {type: integer, default: 1, minimum: 1, maximum: 100}
        limitPolicy: {type: string, enum: [REJECT_NEW, KICK_OLDEST], default: REJECT_NEW}
        packageIds: {type: array, items: {type: string, format: uuid}}
        allowedIps: {type: array, maxItems: 50, items: {type: string, example: '10.0.0.0/24'}, description: 'stored in CIDR form; a network must not have host bits'}
        allowedCountries: {type: array, maxItems: 50, items: {type: string, example: BG}}
        note: {type: string, maxLength: 2000, nullable: true}
    Subscriber:
      type: object
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        fullName: {type: string, nullable: true}
        phone: {type: string, nullable: true}
        email: {type: string, nullable: true}
        status: {$ref: '#/components/schemas/SubscriberStatus'}
        expiresAt: {type: string, format: date, nullable: true}
        daysLeft: {type: integer, format: int64, nullable: true, description: 'days until expiresAt (0 = last day, negative = passed)'}
        maxConnections: {type: integer}
        limitPolicy: {type: string, enum: [REJECT_NEW, KICK_OLDEST]}
        packageIds: {type: array, items: {type: string, format: uuid}}
        packages:
          type: array
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              name: {type: string}
        allowedIps: {type: array, items: {type: string}}
        allowedCountries: {type: array, items: {type: string}}
        note: {type: string, nullable: true}
        hasPassword: {type: boolean}
        token: {type: string, description: 32 base62 characters}
        playlistUrl: {type: string, format: uri, example: 'https://tv.example.com/pl/<token>.m3u'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Session:
      type: object
      properties:
        sessionKey: {type: string}
        subscriberId: {type: string, format: uuid}
        username: {type: string}
        streamId: {type: string, format: uuid}
        streamName: {type: string}
        ip: {type: string}
        country: {type: string}
        userAgent: {type: string}
        edgeNode: {type: string}
        protocol: {type: string, enum: [HLS, HTTP_TS]}
        startedAt: {type: string, format: date-time}
        bytesSent: {type: integer}
    Node:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        role: {type: string, enum: [INGEST, EDGE, ALL_IN_ONE]}
        publicHost: {type: string}
        status: {type: string, enum: [ONLINE, OFFLINE, DRAIN]}
        maxStreams: {type: integer}
        agentVersion: {type: string}
        ffmpegVersion: {type: string}
        metrics:
          nullable: true
          description: 'Last metrics of the agent (TVR-035); null when none came in the last 30 s'
          allOf: [{$ref: '#/components/schemas/LiveNodeMetrics'}]
        lastSeenAt: {type: string, format: date-time}
        connected: {type: boolean, description: 'Open gRPC stream from the agent right now'}
    DashboardSummary:
      type: object
      description: "TVR-034. viewersNow stays null until sessions (TVR-066); activeSubscribers = subscribers with status ACTIVE (TVR-040), null when they cannot be counted; egressBps = network out of all servers with fresh metrics, null when none (TVR-035)."
      properties:
        at: {type: string, format: date-time}
        streams:
          type: object
          description: Channels (not deleted) per runtime state; a disabled channel counts as stopped
          properties:
            total: {type: integer}
            online: {type: integer}
            degraded: {type: integer}
            offline: {type: integer}
            starting: {type: integer}
            error: {type: integer}
            stopped: {type: integer}
        problems:
          type: array
          description: Enabled channels in OFFLINE / ERROR (first) or DEGRADED, the longest-lasting first; at most 20
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              name: {type: string}
              slug: {type: string}
              logoUrl: {type: string, nullable: true}
              state: {$ref: '#/components/schemas/StreamState'}
              lastError: {type: string, nullable: true}
              since: {type: string, format: date-time, nullable: true}
              nodeId: {type: string, format: uuid, nullable: true}
        nodes:
          type: object
          properties:
            online: {type: integer}
            total: {type: integer}
        recentEvents:
          type: array
          description: The 10 newest events of all channels in the last 24 h (stream_event, TVR-029)
          items:
            type: object
            properties:
              id: {type: integer, format: int64}
              ts: {type: string, format: date-time}
              streamId: {type: string, format: uuid}
              streamName: {type: string}
              streamSlug: {type: string}
              type: {type: string}
              inputId: {type: string, format: uuid, nullable: true}
              message: {type: string, nullable: true}
              data: {type: object, additionalProperties: true}
        viewersNow: {type: integer, nullable: true}
        egressBps: {type: integer, nullable: true}
        activeSubscribers: {type: integer, nullable: true}
